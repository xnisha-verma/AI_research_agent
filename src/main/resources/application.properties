spring.application.name=spring-boot-ai-research-agent
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update


proxy.host=
proxy.port=0
proxy.username=
proxy.password=
proxy.user-agent=AI-Research-Agent/1.0 (contact: researchagent@example.com; developer)

#scraping config
scraping.cron=0 0 */3 * * *
scraping.reddit.subreddits=technology,artificial,MachineLearning
scraping.reddit.posts-per-subreddit=15
scraping.hackernews.top-stories-count=30
scraping.producthunt.posts-count=20

#llm config
# Groq config
groq.api-key=${GROQ_API_KEY}
groq.model=openai/gpt-oss-20b
groq.base-url=https://api.groq.com/openai/v1